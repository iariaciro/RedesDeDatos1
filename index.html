<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulacro Redes I · UNNOBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090a;--card:#101012;--bd:rgba(245,176,46,.22);--bd2:rgba(255,255,255,.08);--tx:#f4f1ea;--mut:#8b857a;--ac:#f5b02e;--ac2:#74bdee;--on:#0a0a0b;--ok:#7fd69a;--ko:#ff7a6b;
--disp:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--ui:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ser:'Playfair Display',Georgia,'Times New Roman',serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f1e7;--card:#fffdf8;--bd:rgba(150,100,0,.3);--bd2:rgba(0,0,0,.09);--tx:#17140e;--mut:#6c655a;--ac:#b4730a;--ac2:#1f78b4;--on:#fffdf8;--ok:#1f8a4c;--ko:#c7432f}}
:root[data-theme="dark"]{--bg:#09090a;--card:#101012;--bd:rgba(245,176,46,.22);--bd2:rgba(255,255,255,.08);--tx:#f4f1ea;--mut:#8b857a;--ac:#f5b02e;--ac2:#74bdee;--on:#0a0a0b;--ok:#7fd69a;--ko:#ff7a6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font:16px/1.6 var(--ui);background-color:var(--bg);background-image:repeating-linear-gradient(90deg,transparent 0,transparent 119px,var(--bd2) 119px,var(--bd2) 120px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(18px,4vw,48px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;color:inherit;text-decoration:none}
.brand img{width:38px;height:38px}.brand b{font:400 1.9rem/1 var(--disp);letter-spacing:.14em}.brand b i{font-style:normal;color:var(--ac)}
#nv{display:flex;gap:clamp(14px,3vw,36px);flex-wrap:wrap;justify-content:flex-end}
#nv button{background:none;border:0;padding:6px 0;color:var(--mut);font:500 .74rem var(--ui);letter-spacing:.2em;cursor:pointer;border-bottom:1px solid transparent}
#nv button:hover:not(:disabled),#nv button.on{color:var(--ac);border-color:var(--ac)}#nv button:disabled{opacity:.35;cursor:default}
main{max-width:1180px;margin:0 auto;padding:clamp(28px,6vw,72px) clamp(18px,4vw,48px) 90px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,64px);align-items:start}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.eye{display:flex;align-items:center;gap:14px;color:var(--ac);font:500 .72rem var(--ui);letter-spacing:.26em;margin:0 0 22px}.eye s{width:40px;height:1px;background:var(--bd);background:var(--ac);opacity:.6;flex:none}
h1{margin:0 0 26px;font:400 clamp(4.2rem,13vw,9.5rem)/.9 var(--disp);letter-spacing:.01em}h1 span{display:block}h1 .a{color:var(--ac)}
.ser{font:italic 400 1.15rem/1.7 var(--ser);color:var(--mut);max-width:30em;margin:0 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:14px}
.btn{font:500 .76rem var(--ui);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border-radius:0;border:1px solid var(--bd);background:transparent;color:var(--mut);padding:15px 24px}
.btn:hover:not(:disabled){border-color:var(--ac);color:var(--ac)}.btn.p{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:700}.btn.p:hover{color:var(--on);filter:brightness(1.08)}
.pc{border:1px solid var(--bd);background:var(--card);padding:28px}
.ph{display:flex;align-items:center;gap:16px;margin-bottom:22px}.ph img{width:68px;height:68px;flex:none}
.ph b{display:block;font:500 1.15rem/1.2 var(--ui)}.ph span{color:var(--ac);font-size:.85rem;letter-spacing:.04em}
.st{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--bd2);margin-bottom:22px}
.st div{padding:16px 6px;text-align:center;border-right:1px solid var(--bd2)}.st div:last-child{border:0}
.st b{display:block;font:400 1.9rem/1.1 var(--disp);letter-spacing:.06em}.st small{font-size:.62rem;letter-spacing:.22em;color:var(--mut)}
.lab{font:500 .68rem var(--ui);letter-spacing:.26em;color:var(--ac);margin:0 0 12px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv{background:transparent;border:1px solid var(--bd2);color:var(--tx);padding:16px 14px;text-align:left;cursor:pointer;font:inherit}
.lv:hover{border-color:var(--ac)}.lv b{display:block;font:400 2.3rem/1 var(--disp);color:var(--ac);letter-spacing:.04em}.lv span{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}.lv small{display:block;color:var(--mut);font-size:.72rem;margin-top:2px}
.qw{max-width:720px;margin:0 auto}
.bar{height:2px;background:var(--bd2);margin-bottom:12px}.bar i{display:block;height:100%;background:var(--ac);transition:width .35s}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--mut);font:500 .7rem var(--ui);letter-spacing:.2em;text-transform:uppercase;margin-bottom:26px}.meta em{font-style:normal;color:var(--ac)}
.q{font:700 1.35rem/1.45 var(--ui);margin:0 0 24px;overflow-wrap:anywhere}
.o{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:1px solid var(--bd2);border-radius:0;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}.o:disabled{cursor:default;color:var(--mut)}
.o.ok{color:var(--tx);border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--card))}.o.ko{color:var(--tx);border-color:var(--ko);background:color-mix(in srgb,var(--ko) 9%,var(--card))}
.tools{display:flex;flex-wrap:wrap;gap:22px;margin:18px 0 4px}
.link{font:500 .72rem var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--ac);background:none;border:0;padding:0 0 3px;cursor:pointer;text-decoration:none;border-bottom:1px solid var(--bd)}
.link:hover{border-color:var(--ac)}
.hint{margin:12px 0;padding:4px 0 4px 16px;border-left:2px solid var(--ac);font:italic 400 1.02rem/1.6 var(--ser);color:var(--mut)}
.fb{margin-top:20px;padding:18px;border:1px solid var(--bd2);background:var(--card);font-size:.94rem}
.fb.ok{border-color:var(--ok)}.fb.ko{border-color:var(--ko)}.fb b{font:400 1.4rem/1 var(--disp);letter-spacing:.12em}.fb.ok b{color:var(--ok)}.fb.ko b{color:var(--ko)}
.fb p{margin:10px 0 0;color:var(--mut);font-family:var(--ser);font-style:italic;font-size:1.02rem;line-height:1.65}.fb p span{color:var(--tx);font-style:normal;font-family:var(--ui);font-weight:700;font-size:.92rem}.fb i{color:var(--tx)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:28px}
.big{font:400 clamp(4rem,14vw,7rem)/1 var(--disp);color:var(--ac);margin:6px 0 10px;letter-spacing:.02em}li{margin:12px 0}small{color:var(--mut)}
h2{font:400 clamp(2.4rem,7vw,3.6rem)/1 var(--disp);letter-spacing:.04em;margin:0 0 10px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:flex;justify-content:flex-end}
.dr{width:min(340px,88vw);height:100%;overflow:auto;background:var(--bg);border-left:1px solid var(--bd);padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.drh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font:400 1.5rem var(--disp);letter-spacing:.14em}
.x{background:none;border:0;color:var(--mut);font-size:1.1rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:18px}
.gn{aspect-ratio:1;border:1px solid var(--bd2);background:transparent;color:var(--mut);font:inherit;font-size:.8rem;cursor:pointer}.gn:hover{border-color:var(--ac)}
.gn.ok{border-color:var(--ok);color:var(--ok)}.gn.ko{border-color:var(--ko);color:var(--ko)}.gn.cur{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.mi{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--bd2);background:transparent;color:var(--tx);font:500 .72rem var(--ui);letter-spacing:.18em;text-transform:uppercase;cursor:pointer}.mi:hover{border-color:var(--ac);color:var(--ac)}
.ft{border-top:1px solid var(--bd);padding:26px clamp(18px,4vw,48px) 34px;text-align:center;color:var(--mut);font:500 .7rem var(--ui);letter-spacing:.2em;text-transform:uppercase}.ft b{color:var(--ac);font-weight:700}.ft span{display:block;margin-top:6px;font:italic 400 .95rem var(--ser);letter-spacing:.02em;text-transform:none}
.dr.ai{width:min(440px,92vw)}.an{font:italic 400 1.02rem/1.7 var(--ser);color:var(--tx);margin:0 0 12px}ol.an{padding-left:20px}.an a,.sr a{color:var(--ac)}.sr{padding-left:18px;font-size:.9rem}.nt{font-size:.8rem;color:var(--mut);margin:14px 0}.er{color:var(--ko);font-size:.9rem;margin:0 0 14px}#ki{width:100%;padding:12px;background:var(--card);border:1px solid var(--bd2);color:var(--tx);font:inherit;border-radius:0}.lab{font:500 .68rem var(--ui);letter-spacing:.26em;color:var(--ac);margin:0 0 12px}
a.gq{display:block;text-align:center;text-decoration:none;margin-top:22px}

put([25,26,27,43,67,68],"El switch aprende mirando la MAC ORIGEN de cada trama que recibe y la asocia al puerto por el que entró. Si la MAC destino no está en su tabla, reenvía la trama por todos los puertos menos el de entrada (flooding); si está, la manda solo por el puerto correcto. Un hub no tiene tabla: repite todo por todos sus puertos. Un switch también puede anotar la MAC del switch vecino, aprendida por el enlace entre ambos con tráfico de control como el de STP.","sw");
put([30,31,32],"CSMA/CD (detección de colisiones) corresponde a Ethernet cableado half-duplex: se escucha el medio, se transmite y se detectan colisiones. CSMA/CA (evitación) se usa en Wi-Fi 802.11: una estación no puede escuchar mientras transmite, así que no detecta colisiones y las evita con espera aleatoria (backoff) y confirmaciones (ACK).","csma");
put([33,35,66],"La trama Ethernet mínima de 64 bytes (512 bits, el slot time) asegura que el emisor siga transmitiendo cuando vuelve la señal de colisión, así puede detectarla y retransmitir. Tras una colisión, cada estación espera un tiempo aleatorio (backoff exponencial binario) cuyo rango se duplica con cada colisión consecutiva, y tras 16 intentos desiste. En full-duplex el estándar 802.3 desactiva CSMA/CD porque no hay colisiones.","col");
put([0,59,60,61],"La PDU de cada capa es: bit en la capa 1 (Física), trama en la 2 (Enlace), paquete en la 3 (Red), segmento en la 4 (Transporte) y datos en las capas 5 a 7.","osi");
put([15],"Las siete capas del modelo OSI, de abajo hacia arriba, son: 1 Física, 2 Enlace de datos, 3 Red, 4 Transporte, 5 Sesión, 6 Presentación y 7 Aplicación.","osi");
put([16,17],"En TCP/IP la capa de Acceso a la red combina las capas Física y Enlace de datos de OSI, por eso Enlace de datos no aparece como capa aparte en TCP/IP.","osi");
put([44,45],"El cableado horizontal va del distribuidor (cuarto de telecomunicaciones) del piso hasta las áreas de trabajo, en topología estrella. El vertical o backbone conecta los pisos entre sí y con el resto del edificio, con UTP o fibra óptica.","cab");
put([46],"UTP es par trenzado sin blindaje (Unshielded Twisted Pair) y STP es el blindado (Shielded). El cableado estructurado usa ambos tipos.","cab");
put([69],"En la norma 568 el enlace horizontal permanente llega hasta 90 m, más cordones de unos 5 m en cada extremo: 100 m en total para el canal.","cab");
put([90],"ANSI/TIA/EIA-568-B es la norma de cableado de telecomunicaciones para edificios comerciales: 568-B1 son los requerimientos generales, B2 los componentes de par trenzado balanceado y B3 los de fibra óptica. La 569 trata recorridos y espacios y la 607 la puesta a tierra.","cab");
put([5,6],"En conmutación de paquetes cada paquete viaja de forma independiente, por lo que puede seguir una ruta distinta, y cada nodo debe recibir el paquete completo antes de reenviarlo (store-and-forward).","swc");
put([7],"En conmutación de circuitos se solicita y establece un circuito dedicado entre los extremos antes de transmitir, se usa en forma exclusiva y se libera al terminar.","swc");
put([51],"El punto de acceso (AP) emite beacons periódicos, normalmente cada 100 ms, para anunciar la red. El cliente usa probe requests para buscarlas activamente, por eso la afirmación está invertida.","wifi");
put([79],"El SSID es el nombre de la red inalámbrica y viaja en los beacons que emite el AP.","wifi");
put([63],"La dirección broadcast de Ethernet es FF:FF:FF:FF:FF:FF (todos los bits en 1) y la reciben todos los dispositivos del dominio de broadcast.","bc");
put([64,65],"Un dominio de broadcast es la zona a la que llega un broadcast. Los routers son los que normalmente lo separan; un switch reenvía los broadcast por todos sus puertos y no lo separa.","bc");
put([3],"En Ethernet II el campo de 2 bytes que sigue a las MAC es el TIPO (EtherType); en el formato 802.3 original es la LONGITUD del payload. El estándar 802.3x-1997 los unificó: valores hasta 1500 indican longitud y desde 1536 indican tipo. Por eso la diferencia entre ambas tramas es ese campo, como dice «a y b».","eth");
put([4],"En el formato 802.3 original ese campo es la longitud y el protocolo superior se identifica con LLC; el campo TIPO es de Ethernet II. Hoy el mismo campo puede interpretarse como tipo si vale 1536 o más. En tu parcial se plantea como 802.3 = LONGITUD, así que 802.3 no tiene campo TIPO propio. Si el enunciado cambia, fijate cómo lo dieron en clase.","eth");
put([40],"La consulta ARP (request) se envía por broadcast a ff:ff:ff:ff:ff:ff porque el emisor no sabe dónde está el destino, pero la respuesta (reply) es unicast directo a quien preguntó. Por eso «los mensajes ARP son siempre broadcasts» es falso.","arp");
put([41],"ARP resuelve direcciones IPv4 a direcciones MAC: el host conoce la IP y pregunta por la MAC, no al revés.","arp");
put([42],"La respuesta ARP es unicast al host que preguntó. Por eso la MAC destino de la trama es la de PC1 (no ff:ff:ff:ff:ff:ff), la MAC origen es la de PC2 y el campo TIPO es 0806 (ARP).","arp");
put([47],"1000BASE-LX usa láser de onda larga (1300 nm). Con fibra monomodo llega a unos 5 a 10 km. Matiz: según las fuentes también puede funcionar sobre fibra multimodo hasta unos 550 m, aunque se recomienda monomodo. En las correcciones de tus parciales se tomó como correcta «Fibra Óptica Monomodo». La variante pensada para multimodo es 1000BASE-SX.","lx");
